<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>session-cost glyph preview</title>
<style>
  body {
    margin: 0;
    padding: 18px 22px;
    background: #f6f7f9;
    font: 13px/20px -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    color: #6b7280;
  }
  .row { display: flex; align-items: center; gap: 12px; }
  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 1px 8px; border-radius: 24px; white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  .val { color: #4b5563; }
  svg { width: 14px; height: 14px; flex: none; }
  .sep { color: #c9ced6; margin: 0 6px; }
  .label { margin: 14px 0 6px; color: #9aa1ab; font-size: 12px; }
  .big svg { width: 48px; height: 48px; }
  .grid { display: flex; gap: 26px; align-items: flex-end; }
  .stack { display: flex; flex-direction: column; gap: 16px; }
</style>
</head>
<body>
  <div class="label">1）统计栏整行（13/20 层级，图标 14px，与自带两条对照）</div>
  <div class="row">
    <span class="pill">
      <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.25" fill="none" stroke="currentColor" stroke-width="1.2"/><path fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" d="M2.75 6.1h10.5M4.6 10.1h6.8M6.1 13.4h3.8"/></svg>
      11 轮 · 565 步 · 297 tok/s
    </span>
    <span class="pill">
      <svg viewBox="0 0 16 16" aria-hidden="true"><ellipse cx="8" cy="4.6" rx="5.5" ry="2.3" fill="none" stroke="currentColor" stroke-width="1.2"/><path fill="none" stroke="currentColor" stroke-width="1.2" d="M2.5 4.6v6.8c0 1.27 2.46 2.3 5.5 2.3s5.5-1.03 5.5-2.3V4.6"/><path fill="none" stroke="currentColor" stroke-width="1.2" d="M2.5 8c0 1.27 2.46 2.3 5.5 2.3S13.5 9.27 13.5 8"/></svg>
      202M tok · 缓存命中 99.8%
    </span>
  </div>
  <div class="row" style="margin-top:10px">
    <span class="pill">
      <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="3.75" width="13" height="8.5" rx="2" fill="none" stroke="currentColor" stroke-width="1.2"/><circle cx="8" cy="8" r="2" fill="currentColor"/><circle cx="4.5" cy="8" r="0.7" fill="currentColor"/><circle cx="11.5" cy="8" r="0.7" fill="currentColor"/></svg>
      费用 <span class="val">¥5.38</span><span class="sep">·</span>余额 <span class="val">¥9.43</span>
    </span>
    <span style="color:#c9ced6">← 当前实现</span>
  </div>
  <div class="row" style="margin-top:6px">
    <span class="pill">
      <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="3.75" width="13" height="8.5" rx="2" fill="none" stroke="currentColor" stroke-width="1.2"/><circle cx="8" cy="8" r="1.6" fill="none" stroke="currentColor" stroke-width="1.2"/><circle cx="4.4" cy="8" r="0.6" fill="currentColor"/><circle cx="11.6" cy="8" r="0.6" fill="currentColor"/></svg>
      费用 <span class="val">¥5.38</span><span class="sep">·</span>余额 <span class="val">¥9.43</span>
    </span>
    <span style="color:#c9ced6">← 环线版（重心更轻）</span>
  </div>
  <div class="row" style="margin-top:6px">
    <span class="pill">
      <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="3.5" width="12" height="9.5" rx="2.2" fill="none" stroke="currentColor" stroke-width="1.2"/><path fill="none" stroke="currentColor" stroke-width="1.2" d="M2 7h12"/><circle cx="11.6" cy="9.9" r="0.95" fill="currentColor"/></svg>
      费用 <span class="val">¥5.38</span><span class="sep">·</span>余额 <span class="val">¥9.43</span>
    </span>
    <span style="color:#c9ced6">← 钱包版</span>
  </div>
  <div class="row" style="margin-top:6px">
    <span class="pill">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M8 1.6c-2.6 0-4.1 1.4-4.1 3.5v4.2c0 2 1.9 3.4 4.1 3.4s4.1-1.4 4.1-3.4V5.1c0-2.1-1.5-3.5-4.1-3.5Zm0 1.3c1.7 0 2.7.8 2.7 2.1H5.3c0-1.3 1-2.1 2.7-2.1Z"/><path fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" d="M4.3 11.4c.5 1.9 2 3 4 3s3.5-1.1 4-3" opacity=".55"/></svg>
      费用 <span class="val">¥5.38</span><span class="sep">·</span>余额 <span class="val">¥9.43</span>
    </span>
    <span style="color:#c9ced6">← 金额牌（填充）</span>
  </div>

  <div class="label">2）候选图标放大对照（14 / 32 / 48px）</div>
  <div class="grid">
    <div>
      <div class="big">
        <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="3.75" width="13" height="8.5" rx="2" fill="none" stroke="currentColor" stroke-width="1.2"/><circle cx="8" cy="8" r="2" fill="currentColor"/><circle cx="4.5" cy="8" r="0.7" fill="currentColor"/><circle cx="11.5" cy="8" r="0.7" fill="currentColor"/></svg>
      </div>
      <div>钞票 banknote</div>
    </div>
    <div>
      <div class="big">
        <svg viewBox="0 0 16 16" aria-hidden="true"><ellipse cx="8" cy="4.6" rx="5.5" ry="2.3" fill="none" stroke="currentColor" stroke-width="1.2"/><path fill="none" stroke="currentColor" stroke-width="1.2" d="M2.5 4.6v6.8c0 1.27 2.46 2.3 5.5 2.3s5.5-1.03 5.5-2.3V4.6"/><path fill="none" stroke="currentColor" stroke-width="1.2" d="M2.5 8c0 1.27 2.46 2.3 5.5 2.3S13.5 9.27 13.5 8"/></svg>
      </div>
      <div>硬币堆 coins</div>
    </div>
    <div>
      <div class="big">
        <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="3.5" width="12" height="9.5" rx="2.2" fill="none" stroke="currentColor" stroke-width="1.2"/><path fill="none" stroke="currentColor" stroke-width="1.2" d="M2 7h12"/><circle cx="11.6" cy="9.9" r="0.95" fill="currentColor"/></svg>
      </div>
      <div>钱包 wallet</div>
    </div>
  </div>
</body>
</html>
